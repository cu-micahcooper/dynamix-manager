# Single-service pilot. Set PORT=8000 and attach private persistent storage
# before deploying; see docs/hosted-connector.md for authentication launch gates.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/hosted.Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
