<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeamDynamix Tickets</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif;--ink:light-dark(#182a3a,#e6edf5);--muted:light-dark(#566b7e,#b0c0ce);--line:light-dark(#d7e0e8,#445465);--surface:light-dark(#f6f8fa,#15202b);--link:light-dark(#1557a0,#9bcbff)}*{box-sizing:border-box}body{margin:0;padding:20px;color:var(--ink);background:var(--surface)}[hidden]{display:none!important}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:21px;margin:0}small,.muted{color:var(--muted)}#tickets{display:grid;gap:10px;margin-top:18px}.ticket{border:1px solid var(--line);border-radius:10px;padding:14px}h2{font-size:19px;line-height:1.3;margin:12px 0}h3{font-size:16px;margin:24px 0 8px}p{margin:6px 0}a{color:var(--link)}button{font:inherit;cursor:pointer;color:var(--link);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px}button:hover{background:light-dark(#e8eef5,#283c50)}button:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:3px}button:disabled{opacity:.55;cursor:wait}.ticket-title{display:block;text-align:left;border:0;padding:0;font-size:16px;font-weight:650;overflow-wrap:anywhere}.ticket a{display:inline-block;margin-top:8px;font-size:13px}#warning,#activity-warning{font-size:13px;color:var(--muted)}#detail{margin-top:20px}#detail-title{outline:none;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(100px,1fr) 3fr;gap:8px 16px;margin:16px 0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.prose{white-space:pre-wrap;overflow-wrap:anywhere;max-width:75ch}.activity-item{padding:16px 0;border-top:1px solid var(--line)}.activity-item small{display:block;margin-bottom:6px}#status{color:var(--muted)}#error{color:light-dark(#a12b20,#ffb4a9)}@media(max-width:420px){body{padding:12px}header{align-items:flex-start;flex-direction:column;gap:2px}dl{grid-template-columns:1fr 2fr}}
</style>
<header><h1>TeamDynamix</h1><small>InfoTech Tickets · Read only</small></header>
<p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p>
<section id="results" aria-label="Ticket results">
 <p id="empty">Search for tickets in the conversation to view them here.</p>
 <main id="tickets"></main><p id="warning"></p>
</section>
<section id="detail" hidden aria-label="Ticket details">
 <button id="back" type="button">← Back to results</button>
 <h2 id="detail-title" tabindex="-1"></h2><dl id="fields"></dl>
 <h3>Description</h3><div id="description" class="prose"></div>
 <section id="custom" hidden><h3>Custom fields</h3><dl id="attributes"></dl></section>
 <h3>Activity</h3><button id="load-activity" type="button">Load activity</button>
 <div id="activity"></div><p id="activity-warning"></p>
</section>
<script>
const el=id=>document.getElementById(id);
const pending=new Map();let nextId=0,hostReady=false,selection=0,currentId=null;
let loading=false;
const initId='tdx-init';
function request(method,params){
 return new Promise((resolve,reject)=>{
  const id=`tdx-${++nextId}`;
  const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The connection timed out. Please try again.'));},35000);
  pending.set(id,{resolve,reject,timer});
  window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
 });
}
async function callTool(name,args){
 let result;
 if(hostReady)result=await request('tools/call',{name,arguments:args});
 else if(window.openai?.callTool)result=await window.openai.callTool(name,args);
 else throw new Error('Open this app through its connected ChatGPT plugin to load ticket details.');
 if(result?.isError)throw new Error('TeamDynamix could not load this information. Retry or check the connection.');
 let data=result?.structuredContent;
 if(!data&&Array.isArray(result?.content)){const text=result.content.find(x=>x.type==='text');if(text){try{data=JSON.parse(text.text)}catch{}}}
 if(!data||typeof data!=='object')throw new Error('The connection returned an unsupported response.');
 return data;
}
function setStatus(message=''){el('status').textContent=message;}
function clearError(){el('error').textContent='';}
function addField(root,label,value){
 if(value===null||value===undefined||value==='')return;
 const term=document.createElement('dt'),definition=document.createElement('dd');
 term.textContent=label;definition.textContent=typeof value==='object'?JSON.stringify(value):String(value);root.append(term,definition);
}
function renderResults(data){
 const root=el('tickets');root.replaceChildren();
 const tickets=Array.isArray(data.tickets)?data.tickets:[];
 el('empty').hidden=tickets.length>0;el('empty').textContent='No tickets returned.';
 el('warning').textContent=data.warning||'';
 for(const ticket of tickets){
  const card=document.createElement('article');card.className='ticket';
  const title=document.createElement('button');title.type='button';title.className='ticket-title';
  title.textContent=`#${ticket.ID} · ${ticket.Title||'Untitled'}`;title.onclick=()=>openTicket(ticket.ID);card.append(title);
  const meta=document.createElement('p');meta.className='muted';meta.textContent=[ticket.StatusName,ticket.ResponsibleFullName||ticket.ResponsibleGroupName,ticket.PriorityName].filter(Boolean).join(' · ');card.append(meta);
  try{const url=new URL(ticket.url);if(url.protocol==='https:'&&url.hostname==='cedarville.teamdynamix.com'&&url.pathname.startsWith('/TDNext/')){const link=document.createElement('a');link.href=url.href;link.textContent='Open in TeamDynamix ↗';link.target='_blank';link.rel='noopener noreferrer';card.append(link);}}catch{}
  root.append(card);
 }
}
function renderDetail(data){
 const ticket=data.detail;if(!ticket||!Number.isInteger(ticket.ID))throw new Error('Ticket details were not returned.');
 currentId=ticket.ID;el('results').hidden=true;el('detail').hidden=false;
 el('detail-title').textContent=`#${ticket.ID} · ${ticket.Title||'Untitled'}`;
 const fields=el('fields');fields.replaceChildren();
 for(const [label,value] of [['Status',ticket.StatusName],['Priority',ticket.PriorityName],['Requester',ticket.RequestorName],['Assigned to',ticket.ResponsibleFullName],['Group',ticket.ResponsibleGroupName],['Created',ticket.CreatedDate],['Updated',ticket.ModifiedDate],['Due',ticket.EndDate]])addField(fields,label,value);
 el('description').textContent=data.description_text??ticket.Description??'No description provided.';
 const attributes=el('attributes');attributes.replaceChildren();
 const rows=Array.isArray(ticket.Attributes)?ticket.Attributes:[];
 for(const item of rows)addField(attributes,item.Name||'Field',item.ValueText??item.Value);
 el('custom').hidden=rows.length===0;
 el('activity').replaceChildren();el('activity-warning').textContent='';
 el('load-activity').disabled=false;el('load-activity').textContent='Load activity';
 el('detail-title').focus();
}
function back(){
 selection++;loading=false;currentId=null;clearError();setStatus();
 el('detail').hidden=true;el('results').hidden=false;
 const first=el('tickets').querySelector('button');if(first)first.focus();
}
async function openTicket(id){
 const version=++selection;loading=true;clearError();setStatus(`Loading ticket #${id}…`);
 el('detail').hidden=true;el('results').hidden=false;
 try{const data=await callTool('get_ticket',{ticket_id:id});if(version!==selection)return;
  if(data.detail?.ID!==id)throw new Error('Details do not match the selected ticket.');
  renderDetail(data);setStatus();await loadActivity(version);
 }catch(error){if(version===selection){setStatus();el('error').textContent=error.message;}}
 finally{if(version===selection)loading=false;}
}
async function loadActivity(version=selection){
 const id=currentId;if(id===null)return;el('load-activity').disabled=true;clearError();setStatus('Loading activity…');
 try{const data=await callTool('ticket_feed',{ticket_id:id,limit:25});if(version!==selection||id!==currentId)return;
  if(data.ticket_id!==id)throw new Error('Activity does not match the selected ticket.');
  const root=el('activity');root.replaceChildren();
  for(const item of (data.items||[])){
   const entry=document.createElement('article');entry.className='activity-item';
   const meta=document.createElement('small');meta.textContent=[item.CreatedFullName,item.CreatedDate,item.IsPrivate===false?'Public':'Private / visibility unconfirmed'].filter(Boolean).join(' · ');
   const text=document.createElement('div');text.className='prose';text.textContent=item.body_text??item.Body??'';entry.append(meta,text);root.append(entry);
  }
  if(!data.items?.length)root.textContent='No activity returned.';
  el('activity-warning').textContent=data.warning||'';setStatus();
 }catch(error){if(version===selection){setStatus();el('error').textContent=error.message;}}
 finally{if(version===selection){el('load-activity').disabled=false;el('load-activity').textContent='Refresh activity';}}
}
function render(data){
 if(!data||typeof data!=='object')return;
 selection++;loading=false;clearError();setStatus();
 if(data.detail){renderDetail(data);return;}
 if(Array.isArray(data.tickets)){renderResults(data);back();}
}
el('back').onclick=back;el('load-activity').onclick=()=>loadActivity();
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;
 const msg=event.data;if(msg?.jsonrpc!=='2.0')return;
 if(msg.id===initId&&msg.result){hostReady=true;window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized'},'*');return;}
 if(pending.has(msg.id)){const item=pending.get(msg.id);pending.delete(msg.id);clearTimeout(item.timer);if(msg.error)item.reject(new Error('The app connection rejected this request.'));else item.resolve(msg.result);return;}
 if(msg.method==='ui/notifications/tool-result'&&!loading)render(msg.params?.structuredContent);
});
if(window.parent!==window)window.parent.postMessage({jsonrpc:'2.0',id:initId,method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'teamdynamix',version:'0.2.0'},appCapabilities:{}}},'*');
if(window.openai?.toolOutput)render(window.openai.toolOutput);
window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.toolOutput&&!loading)render(event.detail.globals.toolOutput);});
</script></html>
